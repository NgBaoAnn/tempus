version: '3.8'

services:
  chroma-api:
    build: .
    container_name: tempus-chroma-backend
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PERSIST_DIR=/app/chroma_data
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
